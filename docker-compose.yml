version: '3.8'

services:
  # 1. Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: colizeum_backend
    restart: always
    env_file:
      - .env
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
      - sqlite_data:/app/db_data
    expose:
      - "8000"

  # 2. React Frontend Static Generator
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: colizeum_frontend
    volumes:
      - frontend_build:/usr/share/nginx/html

  # 3. Telegram Bot
  telegram_bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: colizeum_bot
    restart: always
    env_file:
      - .env
    depends_on:
      - backend

  # 4. Internal Nginx Gateway
  infra:
    image: nginx:alpine
    container_name: colizeum_infra
    restart: always
    ports:
      - "127.0.0.1:8000:80"  # Exposes Docker gateway strictly to localhost for host Nginx
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
      - django_static:/app/staticfiles:ro
      - django_media:/app/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  django_static:
  django_media:
  sqlite_data:
  frontend_build: