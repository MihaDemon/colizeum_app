services:
  # 0. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: colizeum_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1. Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: colizeum_backend
    restart: always
    env_file:
      - .env
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
      - postgres_data:/app/db_data
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: colizeum_scheduler
    restart: always
    command: ["python", "manage.py", "run_scheduler"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 2. React Frontend Static Generator
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: colizeum_frontend
    volumes:
      - frontend_build:/usr/share/nginx/html

  # 3. Telegram Bot
  telegram_bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: colizeum_bot
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
      - db

  # 4. Internal Nginx Gateway
  infra:
    image: nginx:alpine
    container_name: colizeum_infra
    restart: always
    ports:
      - "127.0.0.1:8000:80"  # Exposes Docker gateway strictly to localhost for host Nginx
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
      - django_static:/app/staticfiles:ro
      - django_media:/app/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  django_static:
  django_media:
  postgres_data:
  frontend_build: